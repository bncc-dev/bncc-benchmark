name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Check de consistência: recalcula agregados a partir dos brutos commitados
      # e falha se divergirem. Só roda quando há resultados no repo.
      - name: consistencia dos resultados
        run: |
          if ls resultados/*/julgados.jsonl >/dev/null 2>&1; then
            for rodada in resultados/*/; do
              if [ -f "$rodada/julgados.jsonl" ] && [ -f "$rodada/agregados.json" ]; then
                pnpm agregar -- --rodada "$(basename "$rodada")" --verificar
              fi
            done
          else
            echo "Sem resultados commitados; check de consistência pulado."
          fi
